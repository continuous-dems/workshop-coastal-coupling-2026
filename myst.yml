version: 1

project:
  title: "CUDEM/Coastal Coupling Workshop 2026"
  license: "MIT"
  github: &repo-url "https://github.com/continuous-dems/workshop-coastal-coupling-2026"

  error_rules:
    - rule: "doi-link-valid"
      severity: "warn"

  exclude:
    - "_*"
    - "README.md"

  toc:
    - file: "index.md"
    - pattern: "0*.md"

    - title: "Workshop"
      children:
        - file: "modules/01-getting-started/index.md"
        - file: "modules/02a-newport-dem/index.md"
        - file: "modules/02b-inside-the-workflow/index.md"
        - file: "modules/03-explore-dem/index.md"
        - file: "modules/04-new-region/index.md"
        - file: "modules/05-evaluate-dems/index.md"
          children:
            - file: "modules/05-evaluate-dems/building-an-ivert-database.md"
        - file: "modules/06-wrap-it-up/index.md"

    - title: "Reference"
      children:
        - pattern: "reference/*.md"

    - title: "For instructors"
      children:
        - pattern: "for-instructors/*.md"

site:
  template: "book-theme"

  actions:
    - title: "View source"
      url: *repo-url

  options:
    folders: true
    style: "assets/styles/style.css"
    # favicon: favicon.ico
    # logo: site_logo.png
    logo_text: "CUDEM/Coastal Coupling Workshop 2026"
